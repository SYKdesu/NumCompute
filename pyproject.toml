[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "A scientific computing toolkit built with Python and NumPy."
authors = [
    {name = "Hongyu Liu"},
    {name = "Yi Su"},
    {name = "Wenxuan Xue"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
demo = ["jupyterlab>=4", "nbconvert>=7", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["numcompute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
