[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.1.0"
description = "A high-performance scientific computing toolkit built with Python and NumPy."
requires-python = ">=3.10"
dependencies = [
    "numpy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
